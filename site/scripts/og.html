<!doctype html>
<!-- Share image template (1200x630). Rendered to public/og.jpg by scripts/make-og.mjs (npm run og).
     Same system as the site: black sheet with a gray grid, brass rule on top, Gorton title,
     Atkinson text, the red rush stamp, the chapter photo with a 1px light rule. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theta Tau share image</title>
<style>
  @font-face {
    font-family: 'Open Gorton';
    src: url('../src/fonts/open-gorton/OpenGorton-Bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Atkinson OG';
    src: url('../node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 200 800;
    font-style: normal;
  }

  :root {
    --sheet: #000000;
    --text: #f2eee6;
    --text-2: #b4aea2;
    --gold: #c9a24a;
    --red: #cf3a35;
    --grid: rgba(255, 255, 255, 0.06);
    --grid-heavy: rgba(255, 255, 255, 0.10);
    --rule: rgba(242, 238, 230, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--sheet); }
  body { -webkit-font-smoothing: antialiased; color: var(--text); }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    background-color: var(--sheet);
    background-image:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 20px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 20px),
      repeating-linear-gradient(0deg, var(--grid-heavy) 0 1px, transparent 1px 100px),
      repeating-linear-gradient(90deg, var(--grid-heavy) 0 1px, transparent 1px 100px);
    border-top: 2px solid var(--gold);
    overflow: hidden;
  }

  /* text: left column */
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    margin: 0;
    font-family: 'Open Gorton', sans-serif;
    font-weight: 700;
    font-size: 132px;
    line-height: 0.92;
    letter-spacing: 0.02em;
    word-spacing: -0.35em;
    text-transform: uppercase;
    color: var(--text);
  }
  .chapter {
    margin: 32px 0 0;
    font-family: 'Atkinson OG', sans-serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.3;
    color: var(--text);
  }
  .tagline {
    margin: 10px 0 0;
    font-family: 'Atkinson OG', sans-serif;
    font-weight: 400;
    font-size: 24px;
    line-height: 1.35;
    color: var(--text-2);
  }

  /* photo: right, with a 1px light rule */
  .photo { position: absolute; right: 48px; top: 168px; width: 540px; height: 400px; border: 1px solid var(--rule); }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }

  /* the rush stamp, overlapping the photo's top edge, mostly on the black above it */
  .stamp {
    position: absolute; right: 72px; top: 56px; width: 200px; height: 136px; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    border: 3px solid var(--red); border-radius: 4px;
    color: var(--red); text-align: center; line-height: 1;
    font-family: 'Open Gorton', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; word-spacing: -0.35em;
    transform: rotate(-5deg); opacity: 0.95;
  }
  .stamp::before { content: ''; position: absolute; inset: 4px; border: 1px solid var(--red); border-radius: 2px; }
  .s1 { font-size: 38px; }
  .s2 { font-size: 19px; }
  .s3 { font-size: 15px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="text">
      <h1>Theta<br>Tau</h1>
      <p class="chapter">Zeta Epsilon Chapter,<br>Stony Brook University</p>
      <p class="tagline">The only professional co-ed<br>engineering fraternity.</p>
    </div>
    <div class="photo"><img src="../src/assets/photos/chapter-2026.jpg" alt=""></div>
    <div class="stamp" aria-hidden="true">
      <span class="s1">Rush</span>
      <span class="s2">Spring 2027</span>
      <span class="s3">Dates TBA</span>
    </div>
  </div>
</body>
</html>
